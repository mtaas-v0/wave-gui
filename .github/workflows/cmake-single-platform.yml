# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: CMake on a single platform

on:
  workflow_dispatch: 
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: windows-latest
    

    steps:
    
    - name: Generate Timestamp 
      shell: pwsh
      run: |
        # Create timestamp variable in YYYYMMDD-HHMMSS format
        $TIMESTAMP = Get-Date -Format "yyyyMMdd-HHmmss"
        "TIMESTAMP=$TIMESTAMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          
        
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up GCC (MinGW)
      uses: egor-tensin/setup-mingw@v3
      with:
        platform: x64
        
    - name: Run Choco
      if: false
      # pkgconfig ! pkgconfiglite 
      # sdl2 !
      run: choco install pkgconfig sdl2 glfw3 --no-progress

    - name: Install dependencies via vcpkg
      run: vcpkg install pkgconf sdl2 glfw3  fftw3 --triplet=x64-mingw-static 
      # --triplet x64-windows
      
    - name: Patch ImGui CMakeLists.txt for vcpkg GLFW
      shell: pwsh
      run: |
        $path = "external/imgui/CMakeLists.txt"
        if (Test-Path $path) {
          # Replace 'glfw3' with 'glfw' as required by vcpkg's target mapping
          (Get-Content $path) -replace 'set\(GLFW_DEPS glfw3\)', 'set(GLFW_DEPS glfw)' | Set-Content $path
          Write-Host "Successfully patched $path"
        } else {
          Write-Error "Could not find $path"
          exit 1
        }
        (Get-Content $path) | Write-Host
    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: | 
        cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}  "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" `
          -G "MinGW Makefiles" `
          -DCMAKE_CXX_COMPILER=g++ `
          -DCMAKE_C_COMPILER=gcc `
           -DVCPKG_TARGET_TRIPLET=x64-mingw-static `
        -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
        -DPKG_CONFIG_EXECUTABLE="$env:VCPKG_INSTALLATION_ROOT/installed/x64-mingw-static/tools/pkgconf/pkgconf.exe" `
        -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF
#        -DCMAKE_CXX_FLAGS="/wd4005"  -DCMAKE_CXX_FLAGS="/W3"  
#          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md <= msvc use this?

    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      if: false
      working-directory: ${{github.workspace}}/build
      # Execute tests defined by the CMake configuration.
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest -C ${{env.BUILD_TYPE}}


    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        # Formats output as: resvg-windows-20260909-b42
        name: wave-gui-${{ env.TIMESTAMP }}-r${{ github.run_number }}
        path: build
        if-no-files-found: error
        retention-days: 14
